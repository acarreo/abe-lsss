name: CMake build and tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.c_compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            c_compiler: gcc
            cxx_compiler: g++
          - os: ubuntu-latest
            compiler: clang
            c_compiler: clang
            cxx_compiler: clang++
          - os: macos-latest
            compiler: clang
            c_compiler: clang
            cxx_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes libgmp-dev libssl-dev

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: brew install gmp openssl@3

    - name: Configure
      run: |
        cmake_args=()
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          cmake_args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          cmake_args+=("-DCMAKE_PREFIX_PATH=$(brew --prefix gmp)")
        fi
        cmake -S . -B build \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
          -DRELIC_CURVE=bls12-381 \
          -DRELIC_TAG=0.6.0 \
          -DTESTS=ON -DBENCH=OFF -DCLI=ON \
          "${cmake_args[@]}"

    - name: Build
      run: cmake --build build --parallel 2

    - name: Test
      run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install --yes libgmp-dev libssl-dev
    - name: Configure with sanitizers
      run: >-
        cmake -S . -B build
        -DTESTS=ON -DBENCH=OFF -DCLI=OFF
        -DCMAKE_CXX_FLAGS="-Wall -fsanitize=address,undefined -fno-omit-frame-pointer"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
    - name: Build
      run: cmake --build build --parallel 2
    - name: Test
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --test-dir build --output-on-failure
    - name: Leak-check group serialization
      env:
        ASAN_OPTIONS: detect_leaks=1
      run: >-
        build/tests/test_api
        --gtest_filter=AbeLsssApi.GroupElementSerializationRoundTrips
    - name: Leak-check ABE key derivation
      env:
        ASAN_OPTIONS: detect_leaks=1
      run: >-
        build/tests/test_ske
        --gtest_filter=hashToSymmetricKey.TestKDF2
